name: "Cleanup any Scaleway deployments"

on:
  workflow_call:
    inputs:
      scaleway_project_id:
        type: "string"
        description: "The ID of the Scaleway project to deploy for"
        required: true
      scaleway_organization_id:
        type: "string"
        description: "The ID of the Scaleway organization to deploy for"
        required: true
      scaleway_region:
        type: "string"
        description: "The region to deploy the services to"
        required: true
      
      reap_filter:
        type: "string"
        description: "The tag to filter resources to cleanup for"
        required: true
    secrets:
      scaleway_access_key:
        description: "The Scaleway access key to authenticate with"
        required: true
      scaleway_secret_key:
        description: "The Scaleway secret key to authenticate with"
        required: true

jobs:
  determine-reap:
    name: "Determine resources to reap"
    runs-on: "ubuntu-latest"
    outputs:
      container_ids: "${{ steps.container_ids.outputs.ids }}"
      database_instance_ids: "${{ steps.database_instance_ids.outputs.ids }}"
      shared_database_instance_id: "${{ steps.shared_database_instance_id.outputs.id }}"
      vpc_ids: "${{ steps.vpc_ids.outputs.ids }}"
    steps:
      # Containers
      - name: "[Scaleway] Get containers"
        uses: "scaleway/action-scw@v0.0.3"
        id: "containers"
        with:
          access-key: "${{ secrets.scaleway_access_key }}"
          secret-key: "${{ secrets.scaleway_secret_key }}"
          default-project-id: "${{ inputs.scaleway_project_id }}"
          default-organization-id: "${{ inputs.scaleway_organization_id }}"
          args: "container container list region=${{ inputs.scaleway_region }}"
      - name: "[Scaleway] Determine containers to reap"
        id: "container_ids"
        run: |
          IDS=$(echo '${{ steps.containers.outputs.json }}' | jq -c '[.[] | select(.tags[] == "${{ inputs.reap_filter }}") | .id'])
          echo "ids=$IDS" >> $GITHUB_OUTPUT

      # Databases
      - name: "[Scaleway] Get databases"
        uses: "scaleway/action-scw@v0.0.3"
        id: "databases"
        with:
          access-key: "${{ secrets.scaleway_access_key }}"
          secret-key: "${{ secrets.scaleway_secret_key }}"
          default-project-id: "${{ inputs.scaleway_project_id }}"
          default-organization-id: "${{ inputs.scaleway_organization_id }}"
          args: "rdb instance list region=${{ inputs.scaleway_region }}"
      - name: "[Scaleway] Determine databases to reap"
        id: "database_instance_ids"
        run: |
          IDS=$(echo '${{ steps.databases.outputs.json }}' | jq -c '[.[] | select(.tags[] == "${{ inputs.reap_filter }}") | .id'])
          echo "ids=$IDS" >> $GITHUB_OUTPUT

      # The shared QA instance is intentionally not tagged as ephemeral and must
      # never be deleted by this cleanup workflow.
      - name: "[Scaleway] Find shared QA database instance"
        uses: "scaleway/action-scw@v0.0.3"
        id: "shared_database_instances"
        with:
          access-key: "${{ secrets.scaleway_access_key }}"
          secret-key: "${{ secrets.scaleway_secret_key }}"
          default-project-id: "${{ inputs.scaleway_project_id }}"
          default-organization-id: "${{ inputs.scaleway_organization_id }}"
          args: "rdb instance list region=${{ inputs.scaleway_region }} project-id=${{ inputs.scaleway_project_id }} name=qa-shared"
      - name: "[Scaleway] Resolve shared QA database instance"
        id: "shared_database_instance_id"
        env:
          DATABASE_INSTANCES: "${{ steps.shared_database_instances.outputs.json }}"
        run: |
          INSTANCE_ID=$(jq -r '[.[] | select(.name == "qa-shared")][0].id // empty' <<< "$DATABASE_INSTANCES")
          echo "id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
      
      # Networks
      - name: "[Scaleway] Get VPC's"
        uses: "scaleway/action-scw@v0.0.3"
        id: "vpc"
        with:
          access-key: "${{ secrets.scaleway_access_key }}"
          secret-key: "${{ secrets.scaleway_secret_key }}"
          default-project-id: "${{ inputs.scaleway_project_id }}"
          default-organization-id: "${{ inputs.scaleway_organization_id }}"
          args: "vpc private-network list region=${{ inputs.scaleway_region }}"
      # Only drains the per-PR networks created before QA moved to a shared one;
      # the untagged qa-shared network is never reaped.
      - name: "[Scaleway] Determine networks to reap"
        id: "vpc_ids"
        env:
          PRIVATE_NETWORKS: "${{ steps.vpc.outputs.json }}"
          REAP_FILTER: "${{ inputs.reap_filter }}"
        run: |
          IDS=$(jq -c --arg filter "$REAP_FILTER" '[.[] | select(.name != "qa-shared") | select(((.tags // []) | index($filter)) != null) | .id]' <<< "$PRIVATE_NETWORKS")
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"

  reap-containers:
    name: "Reap containers"
    needs: "determine-reap"
    if: "${{ needs.determine-reap.outputs.container_ids != '[]' }}"
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        container_id: ${{ fromJson(needs.determine-reap.outputs.container_ids) }}
    steps:
      - name: "[Scaleway] Reap containers"
        uses: "scaleway/action-scw@v0.0.3"
        with:
          access-key: "${{ secrets.scaleway_access_key }}"
          secret-key: "${{ secrets.scaleway_secret_key }}"
          default-project-id: "${{ inputs.scaleway_project_id }}"
          default-organization-id: "${{ inputs.scaleway_organization_id }}"
          args: "container container delete region=${{ inputs.scaleway_region }} ${{ matrix.container_id }}"

  reap-databases:
    name: "Reap databases"
    needs: ["determine-reap", "reap-containers"]
    if: "${{ always() && needs.determine-reap.outputs.database_instance_ids != '[]' }}"
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        database_instance_id: ${{ fromJson(needs.determine-reap.outputs.database_instance_ids) }}
    steps:
      - name: "[Scaleway] Reap databases"
        uses: "scaleway/action-scw@v0.0.3"
        with:
          access-key: "${{ secrets.scaleway_access_key }}"
          secret-key: "${{ secrets.scaleway_secret_key }}"
          default-project-id: "${{ inputs.scaleway_project_id }}"
          default-organization-id: "${{ inputs.scaleway_organization_id }}"
          args: "rdb instance delete region=${{ inputs.scaleway_region }} ${{ matrix.database_instance_id }}"

  reap-pr-database:
    name: "Reap PR database from shared instance"
    needs: ["determine-reap", "reap-containers"]
    if: "${{ always() && github.event.number != '' && needs.determine-reap.outputs.shared_database_instance_id != '' }}"
    runs-on: "ubuntu-latest"
    steps:
      - name: "[Scaleway] List databases on shared instance"
        uses: "scaleway/action-scw@v0.0.3"
        id: "databases"
        with:
          access-key: "${{ secrets.scaleway_access_key }}"
          secret-key: "${{ secrets.scaleway_secret_key }}"
          default-project-id: "${{ inputs.scaleway_project_id }}"
          default-organization-id: "${{ inputs.scaleway_organization_id }}"
          args: "rdb database list region=${{ inputs.scaleway_region }} instance-id=${{ needs.determine-reap.outputs.shared_database_instance_id }}"
      - name: "[Scaleway] Check whether PR database exists"
        id: "pr_database"
        env:
          DATABASES: "${{ steps.databases.outputs.json }}"
          DATABASE_NAME: "qa-${{ github.event.number }}"
        run: |
          if jq -e --arg name "$DATABASE_NAME" '[.[] | select(.name == $name)] | length > 0' <<< "$DATABASES" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: "[Scaleway] Delete PR database"
        uses: "scaleway/action-scw@v0.0.3"
        if: "${{ steps.pr_database.outputs.exists == 'true' }}"
        with:
          access-key: "${{ secrets.scaleway_access_key }}"
          secret-key: "${{ secrets.scaleway_secret_key }}"
          default-project-id: "${{ inputs.scaleway_project_id }}"
          default-organization-id: "${{ inputs.scaleway_organization_id }}"
          args: "rdb database delete region=${{ inputs.scaleway_region }} instance-id=${{ needs.determine-reap.outputs.shared_database_instance_id }} name=qa-${{ github.event.number }}"
      - name: "[Scaleway] List users on shared instance"
        uses: "scaleway/action-scw@v0.0.3"
        id: "database_users"
        with:
          access-key: "${{ secrets.scaleway_access_key }}"
          secret-key: "${{ secrets.scaleway_secret_key }}"
          default-project-id: "${{ inputs.scaleway_project_id }}"
          default-organization-id: "${{ inputs.scaleway_organization_id }}"
          args: "rdb user list region=${{ inputs.scaleway_region }} instance-id=${{ needs.determine-reap.outputs.shared_database_instance_id }}"
      - name: "[Scaleway] Check whether PR database user exists"
        id: "pr_database_user"
        env:
          DATABASE_USERS: "${{ steps.database_users.outputs.json }}"
          DATABASE_USER: "qa-${{ github.event.number }}"
        run: |
          if jq -e --arg name "$DATABASE_USER" '[.[] | select(.name == $name)] | length > 0' <<< "$DATABASE_USERS" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: "[Scaleway] Delete PR database user"
        uses: "scaleway/action-scw@v0.0.3"
        if: "${{ steps.pr_database_user.outputs.exists == 'true' }}"
        with:
          access-key: "${{ secrets.scaleway_access_key }}"
          secret-key: "${{ secrets.scaleway_secret_key }}"
          default-project-id: "${{ inputs.scaleway_project_id }}"
          default-organization-id: "${{ inputs.scaleway_organization_id }}"
          args: "rdb user delete region=${{ inputs.scaleway_region }} instance-id=${{ needs.determine-reap.outputs.shared_database_instance_id }} name=qa-${{ github.event.number }}"
  
  reap-vpcs:
    name: "Reap VPC's"
    needs: ["determine-reap", "reap-containers", "reap-databases", "reap-pr-database"]
    if: "${{ always() && needs.determine-reap.outputs.vpc_ids != '[]' }}"
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        vpc_id: ${{ fromJson(needs.determine-reap.outputs.vpc_ids) }}
    steps:
      - name: "[Scaleway] Check for containers still attached to VPC"
        uses: "scaleway/action-scw@v0.0.3"
        id: "containers_before_wait"
        with:
          access-key: "${{ secrets.scaleway_access_key }}"
          secret-key: "${{ secrets.scaleway_secret_key }}"
          default-project-id: "${{ inputs.scaleway_project_id }}"
          default-organization-id: "${{ inputs.scaleway_organization_id }}"
          args: "container container list region=${{ inputs.scaleway_region }}"
      - name: "[Scaleway] Determine whether VPC is still in use"
        id: "vpc_in_use"
        env:
          CONTAINERS: "${{ steps.containers_before_wait.outputs.json }}"
          VPC_ID: "${{ matrix.vpc_id }}"
        run: |
          ATTACHED=$(jq --arg vpc_id "$VPC_ID" '[.[] | select(.private_network_id == $vpc_id)] | length' <<< "$CONTAINERS")
          echo "attached=$([[ "$ATTACHED" -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: "[Scaleway] Wait for container detachment"
        if: "${{ steps.vpc_in_use.outputs.attached == 'true' }}"
        run: "sleep 60"
      - name: "[Scaleway] Recheck VPC container attachments"
        uses: "scaleway/action-scw@v0.0.3"
        id: "containers_after_wait"
        if: "${{ steps.vpc_in_use.outputs.attached == 'true' }}"
        with:
          access-key: "${{ secrets.scaleway_access_key }}"
          secret-key: "${{ secrets.scaleway_secret_key }}"
          default-project-id: "${{ inputs.scaleway_project_id }}"
          default-organization-id: "${{ inputs.scaleway_organization_id }}"
          args: "container container list region=${{ inputs.scaleway_region }}"
      - name: "[Scaleway] Confirm containers detached from VPC"
        id: "vpc_still_in_use"
        if: "${{ steps.vpc_in_use.outputs.attached == 'true' }}"
        env:
          CONTAINERS: "${{ steps.containers_after_wait.outputs.json }}"
          VPC_ID: "${{ matrix.vpc_id }}"
        run: |
          ATTACHED=$(jq --arg vpc_id "$VPC_ID" '[.[] | select(.private_network_id == $vpc_id)] | length' <<< "$CONTAINERS")
          if [[ "$ATTACHED" -gt 0 ]]; then
            echo "Scaleway still reports $ATTACHED container(s) attached to VPC $VPC_ID after waiting; leaving the VPC for a later cleanup run." >&2
            exit 1
          fi
      - name: "[Scaleway] Reap VPC's"
        uses: "scaleway/action-scw@v0.0.3"
        if: "${{ steps.vpc_still_in_use.outcome != 'failure' }}"
        with:
          access-key: "${{ secrets.scaleway_access_key }}"
          secret-key: "${{ secrets.scaleway_secret_key }}"
          default-project-id: "${{ inputs.scaleway_project_id }}"
          default-organization-id: "${{ inputs.scaleway_organization_id }}"
          args: "vpc private-network delete region=${{ inputs.scaleway_region }} ${{ matrix.vpc_id }}"
