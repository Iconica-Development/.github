name: "Iconica Standard Scaleway container deployment"

# Should only be used in workflows executed in PR's

# https://docs.github.com/en/actions/using-workflows/reusing-workflows
on:
  workflow_call:
    inputs:
      scaleway_project_id:
        type: "string"
        description: "The ID of the Scaleway project to deploy for"
        required: true
      scaleway_organization_id:
        type: "string"
        description: "The ID of the Scaleway organization to deploy for"
        required: true
      scaleway_region:
        type: "string"
        description: "The region to deploy the services to"
        required: true

      deploy_database:
        type: "boolean"
        description: "Whether the application needs a PostgreSQL database deployed (default=false)"
        required: false
        default: false

      container_context:
        type: "string"
        description: "Subfolder where the container context is located (default=.)"
        required: false
        default: "."
      container_file:
        type: "string"
        description: "Name of the container file to build (default=Containerfile)"
        required: false
        default: "Containerfile"
      container_build_args:
        type: "string"
        description: "Additional build arguments to pass along while building the container (default=none)"
        required: false
        default: ""
      container_port:
        type: "string"
        description: "The port the deployed container should publish (default=8080)"
        required: false
        default: "8080"
      container_deployment_extra_arguments:
        type: "string"
        description: "Extra arguments to pass when deploying the container. Can be used for setting environment variables for example (default=none)"
        required: false
        default: ""
      container_registry:
        type: "string"
        description: "Registry to push the container image to"
        required: true
      container_name:
        type: "string"
        description: "Name of the final container image"
        required: true
      container_deployment_namespace_id:
        type: "string"
        description: "ID of the container namespace that contains the required environment variables and secrets for the container to run"
        required: true
      pre_build_commands:
        type: "string"
        description: "Any commands to be executed before building"
        required: false
        default: ""

    secrets:
      scaleway_access_key:
        description: "The Scaleway access key to authenticate with"
        required: true
      scaleway_secret_key:
        description: "The Scaleway secret key to authenticate with"
        required: true
    
    outputs:
      url:
        description: "The URL of the deployed container"
        value: "${{ jobs.deploy.outputs.url }}"

jobs:
  build:
    name: "Build the container"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Clone the code"
        uses: "actions/checkout@v7"
      - name: "Setup Docker Buildx"
        uses: "docker/setup-buildx-action@v4"
      - name: "Login to Scaleway container registry"
        uses: "docker/login-action@v3"
        with:
          username: "nologin"
          password: "${{ secrets.scaleway_secret_key }}"
          registry: "${{ inputs.container_registry }}"

      - name: "Execute commands before building"
        if: "${{ inputs.pre_build_commands != '' }}"
        run: "${{ inputs.pre_build_commands }}"

      # Build
      - name: "Build and push the container image"
        uses: "docker/build-push-action@v7"
        with:
          context: "${{ inputs.container_context }}"
          push: true
          file: "${{ inputs.container_file }}"
          build-args: ${{ inputs.container_build_args }}
          tags: "${{ inputs.container_registry }}/qa-test:qa-${{ github.run_id }}"
          cache-from: "type=gha"
          cache-to: "type=gha,mode=max"

  deploy:
    name: "Deploy the container on Scaleway"
    needs: "build"
    runs-on: "ubuntu-latest"
    outputs:
      url: "${{ fromJson(steps.container.outputs.json).public_endpoint }}"
    steps:
      # VPC
      - name: "[Scaleway] Create VPC"
        uses: "scaleway/action-scw@v0.0.3"
        id: "vpc"
        with:
          access-key: "${{ secrets.scaleway_access_key }}"
          secret-key: "${{ secrets.scaleway_secret_key }}"
          default-project-id: "${{ inputs.scaleway_project_id }}"
          default-organization-id: "${{ inputs.scaleway_organization_id }}"
          args: >
            vpc private-network create region=${{ inputs.scaleway_region }}
              name=qa-${{ github.event.number }}
              tags.0=ephemeral=true
              tags.1=pr-id=${{ github.event.number }}

      # Provision one shared instance on first use; subsequent PRs reuse it.
      - name: "[Scaleway] Find shared database instance"
        uses: "scaleway/action-scw@v0.0.3"
        id: "database_instances"
        if: "${{ inputs.deploy_database }}"
        with:
          access-key: "${{ secrets.scaleway_access_key }}"
          secret-key: "${{ secrets.scaleway_secret_key }}"
          default-project-id: "${{ inputs.scaleway_project_id }}"
          default-organization-id: "${{ inputs.scaleway_organization_id }}"
          args: "rdb instance list region=${{ inputs.scaleway_region }} name=qa-shared"
      - name: "[Scaleway] Check whether shared database instance exists"
        id: "database_instance_exists"
        if: "${{ inputs.deploy_database }}"
        env:
          DATABASE_INSTANCES: "${{ steps.database_instances.outputs.json }}"
        run: |
          COUNT=$(jq '[.[] | select(.name == "qa-shared")] | length' <<< "$DATABASE_INSTANCES")
          if [[ "$COUNT" -gt 1 ]]; then
            echo "Expected at most one managed database instance named qa-shared" >&2
            exit 1
          fi
          echo "exists=$([[ "$COUNT" -eq 1 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: "[Scaleway] Create shared database instance"
        uses: "scaleway/action-scw@v0.0.3"
        if: "${{ inputs.deploy_database && steps.database_instance_exists.outputs.exists == 'false' }}"
        with:
          access-key: "${{ secrets.scaleway_access_key }}"
          secret-key: "${{ secrets.scaleway_secret_key }}"
          default-project-id: "${{ inputs.scaleway_project_id }}"
          default-organization-id: "${{ inputs.scaleway_organization_id }}"
          args: >
            rdb instance create --wait region=${{ inputs.scaleway_region }}
              name=qa-shared
              engine=PostgreSQL-17
              user-name=qa
              password=QA-prtest01!
              node-type="DB-DEV-S"
              disable-backup=true
              init-endpoints.0.load-balancer=true
      - name: "[Scaleway] Find shared database instance after provisioning"
        uses: "scaleway/action-scw@v0.0.3"
        id: "provisioned_database_instances"
        if: "${{ inputs.deploy_database }}"
        with:
          access-key: "${{ secrets.scaleway_access_key }}"
          secret-key: "${{ secrets.scaleway_secret_key }}"
          default-project-id: "${{ inputs.scaleway_project_id }}"
          default-organization-id: "${{ inputs.scaleway_organization_id }}"
          args: "rdb instance list region=${{ inputs.scaleway_region }} name=qa-shared"
      - name: "[Scaleway] Resolve shared database instance"
        id: "database_instance_id"
        if: "${{ inputs.deploy_database }}"
        env:
          DATABASE_INSTANCES: "${{ steps.provisioned_database_instances.outputs.json }}"
        run: |
          INSTANCE_ID=$(jq -er '[.[] | select(.name == "qa-shared")] | if length == 1 then .[0].id else error("Expected exactly one managed database instance named qa-shared") end' <<< "$DATABASE_INSTANCES")
          echo "id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
      - name: "[Scaleway] Get shared database endpoints"
        uses: "scaleway/action-scw@v0.0.3"
        id: "database_endpoints"
        if: "${{ inputs.deploy_database }}"
        with:
          access-key: "${{ secrets.scaleway_access_key }}"
          secret-key: "${{ secrets.scaleway_secret_key }}"
          default-project-id: "${{ inputs.scaleway_project_id }}"
          default-organization-id: "${{ inputs.scaleway_organization_id }}"
          args: "rdb endpoint list region=${{ inputs.scaleway_region }} ${{ steps.database_instance_id.outputs.id }}"
      - name: "[Scaleway] Check whether public database endpoint exists"
        id: "database_endpoint_exists"
        if: "${{ inputs.deploy_database }}"
        env:
          DATABASE_ENDPOINTS: "${{ steps.database_endpoints.outputs.json }}"
        run: |
          if jq -e '[.[] | select(.load_balancer != null)] | length > 0' <<< "$DATABASE_ENDPOINTS" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: "[Scaleway] Create public database endpoint"
        uses: "scaleway/action-scw@v0.0.3"
        if: "${{ inputs.deploy_database && steps.database_endpoint_exists.outputs.exists == 'false' }}"
        with:
          access-key: "${{ secrets.scaleway_access_key }}"
          secret-key: "${{ secrets.scaleway_secret_key }}"
          default-project-id: "${{ inputs.scaleway_project_id }}"
          default-organization-id: "${{ inputs.scaleway_organization_id }}"
          args: "rdb endpoint create ${{ steps.database_instance_id.outputs.id }} region=${{ inputs.scaleway_region }} load-balancer=true"
      - name: "[Scaleway] Get database endpoints after provisioning"
        uses: "scaleway/action-scw@v0.0.3"
        id: "provisioned_database_endpoints"
        if: "${{ inputs.deploy_database }}"
        with:
          access-key: "${{ secrets.scaleway_access_key }}"
          secret-key: "${{ secrets.scaleway_secret_key }}"
          default-project-id: "${{ inputs.scaleway_project_id }}"
          default-organization-id: "${{ inputs.scaleway_organization_id }}"
          args: "rdb endpoint list region=${{ inputs.scaleway_region }} ${{ steps.database_instance_id.outputs.id }}"
      - name: "[Scaleway] Resolve public database endpoint"
        id: "database_endpoint"
        if: "${{ inputs.deploy_database }}"
        env:
          DATABASE_ENDPOINTS: "${{ steps.provisioned_database_endpoints.outputs.json }}"
        run: |
          ENDPOINT=$(jq -cer '[.[] | select(.load_balancer != null)][0] // error("The shared QA database instance must have a public endpoint")' <<< "$DATABASE_ENDPOINTS")
          echo "host=$(jq -r '.ip' <<< "$ENDPOINT")" >> "$GITHUB_OUTPUT"
          echo "port=$(jq -r '.port' <<< "$ENDPOINT")" >> "$GITHUB_OUTPUT"
      - name: "[Scaleway] Allow QA database connections"
        uses: "scaleway/action-scw@v0.0.3"
        if: "${{ inputs.deploy_database }}"
        with:
          access-key: "${{ secrets.scaleway_access_key }}"
          secret-key: "${{ secrets.scaleway_secret_key }}"
          default-project-id: "${{ inputs.scaleway_project_id }}"
          default-organization-id: "${{ inputs.scaleway_organization_id }}"
          args: "rdb acl set region=${{ inputs.scaleway_region }} instance-id=${{ steps.database_instance_id.outputs.id }} 0.0.0.0/0"
      - name: "[Scaleway] List databases on shared instance"
        uses: "scaleway/action-scw@v0.0.3"
        id: "databases"
        if: "${{ inputs.deploy_database }}"
        with:
          access-key: "${{ secrets.scaleway_access_key }}"
          secret-key: "${{ secrets.scaleway_secret_key }}"
          default-project-id: "${{ inputs.scaleway_project_id }}"
          default-organization-id: "${{ inputs.scaleway_organization_id }}"
          args: "rdb database list region=${{ inputs.scaleway_region }} instance-id=${{ steps.database_instance_id.outputs.id }}"
      - name: "[Scaleway] Check whether PR database exists"
        id: "pr_database"
        if: "${{ inputs.deploy_database }}"
        env:
          DATABASES: "${{ steps.databases.outputs.json }}"
          DATABASE_NAME: "qa-${{ github.event.number }}"
        run: |
          if jq -e --arg name "$DATABASE_NAME" '[.[] | select(.name == $name)] | length > 0' <<< "$DATABASES" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: "[Scaleway] Create PR database"
        uses: "scaleway/action-scw@v0.0.3"
        if: "${{ inputs.deploy_database && steps.pr_database.outputs.exists != 'true' }}"
        with:
          access-key: "${{ secrets.scaleway_access_key }}"
          secret-key: "${{ secrets.scaleway_secret_key }}"
          default-project-id: "${{ inputs.scaleway_project_id }}"
          default-organization-id: "${{ inputs.scaleway_organization_id }}"
          args: "rdb database create region=${{ inputs.scaleway_region }} instance-id=${{ steps.database_instance_id.outputs.id }} name=qa-${{ github.event.number }}"
      - name: "[Scaleway] Grant QA user access to PR database"
        uses: "scaleway/action-scw@v0.0.3"
        if: "${{ inputs.deploy_database }}"
        with:
          access-key: "${{ secrets.scaleway_access_key }}"
          secret-key: "${{ secrets.scaleway_secret_key }}"
          default-project-id: "${{ inputs.scaleway_project_id }}"
          default-organization-id: "${{ inputs.scaleway_organization_id }}"
          args: "rdb privilege set region=${{ inputs.scaleway_region }} instance-id=${{ steps.database_instance_id.outputs.id }} database-name=qa-${{ github.event.number }} user-name=qa permission=all"
    
      # Container
      - name: "[Scaleway] Deploy container"
        uses: "scaleway/action-scw@v0.0.3"
        id: "container"
        with:
          access-key: "${{ secrets.scaleway_access_key }}"
          secret-key: "${{ secrets.scaleway_secret_key }}"
          default-project-id: "${{ inputs.scaleway_project_id }}"
          default-organization-id: "${{ inputs.scaleway_organization_id }}"
          args: >
            container container create --wait region=${{ inputs.scaleway_region }}
              namespace-id=${{ inputs.container_deployment_namespace_id }}
              name=${{ inputs.container_name }}-${{ github.event.number }}
              min-scale=0 max-scale=1 memory-limit-bytes=0.128G mvcpu-limit=100
              image=${{ inputs.container_registry }}/qa-test:qa-${{ github.run_id }}
              port=${{ inputs.container_port }}
              private-network-id=${{ fromJson(steps.vpc.outputs.json).id }}
              https-connections-only=true
              tags.0=ephemeral=true
              tags.1=pr-id=${{ github.event.number }}
              ${{ inputs.deploy_database && format('environment-variables.DATABASE_HOST={0}', steps.database_endpoint.outputs.host) || '' }}
              ${{ inputs.deploy_database && format('environment-variables.DATABASE_PORT={0}', steps.database_endpoint.outputs.port) || '' }}
              ${{ inputs.deploy_database && format('environment-variables.DATABASE_NAME=qa-{0}', github.event.number) || '' }}
              ${{ inputs.deploy_database && 'environment-variables.DATABASE_USER=qa' || '' }}
              ${{ inputs.deploy_database && 'secret-environment-variables.DATABASE_PASSWORD=QA-prtest01!' || '' }}
              ${{ inputs.container_deployment_extra_arguments }}
